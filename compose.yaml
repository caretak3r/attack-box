services:
  bait:
    build:
      context: .
      dockerfile: Dockerfile
    image: attackbox-bait:latest
    container_name: attackbox-bait
    
    # Non-root user 65532:65532 (Chainguard nonroot, matches host abx-bait group)
    user: "65532:65532"
    
    # gVisor runtime for additional isolation
    # NOTE: Only runc is available on this host; runsc execution blocked
    # This directive is included for deployment to hosts with gVisor installed
    runtime: runsc
    
    # Read-only root filesystem
    read_only: true
    
    # Drop all capabilities
    cap_drop:
      - ALL
    
    # Security hardening
    security_opt:
      - no-new-privileges:true
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
          pids: 100
        reservations:
          cpus: '0.5'
          memory: 128M
    
    # Writable paths (bounded tmpfs)
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /run/attackbox:rw,noexec,nosuid,nodev,size=4m,mode=0770,uid=65532,gid=65532
    
    # Spool socket mount (host shipper listener)
    volumes:
      - type: bind
        source: /run/attackbox/spool.sock
        target: /run/attackbox/spool.sock
        read_only: false
    
    # Redaction secret
    secrets:
      - attackbox_secret
    
    # Environment configuration
    environment:
      # Listener addresses (internal only)
      ATTACKBOX_OPENAI_ADDR: "0.0.0.0:8080"
      ATTACKBOX_VLLM_ADDR: "off"
      ATTACKBOX_OLLAMA_ADDR: "off"
      
      # Models
      ATTACKBOX_MODELS: "gpt-4o,gpt-4o-mini,gpt-3.5-turbo,claude-3-5-sonnet,claude-3-opus"
      
      # Instance identifier
      ATTACKBOX_INSTANCE: "attackbox-bait"
      
      # Redaction secret from Docker secret
      ATTACKBOX_SECRET_FILE: "/run/secrets/attackbox_secret"
      
      # Spool socket (no New Relic key in bait)
      ATTACKBOX_SPOOL_SOCKET: "/run/attackbox/spool.sock"
      ATTACKBOX_SPOOL_QUEUE: "10000"
      ATTACKBOX_SPOOL_TIMEOUT: "5s"
      
      # Resource limits
      ATTACKBOX_MAX_SESSIONS: "5000"
      ATTACKBOX_MAX_BODY_BYTES: "1048576"
      ATTACKBOX_MAX_LOG_BODY: "131072"
      ATTACKBOX_MAX_PER_SOURCE: "8"
      ATTACKBOX_MAX_IN_FLIGHT: "256"
      
      # Timing configuration
      ATTACKBOX_HOLD_SILENT: "150s"
      ATTACKBOX_IDLE_INTERVAL: "45s"
      ATTACKBOX_MAX_STREAM: "180s"
      ATTACKBOX_TIMING: "true"
      
      # HTTP timeouts
      ATTACKBOX_READ_HEADER_TIMEOUT: "10s"
      ATTACKBOX_READ_TIMEOUT: "30s"
      ATTACKBOX_IDLE_TIMEOUT: "60s"
      ATTACKBOX_SHUTDOWN_TIMEOUT: "15s"
    
    # Healthcheck using built-in -healthcheck flag
    healthcheck:
      test: ["CMD", "/attackbox", "-healthcheck", "http://127.0.0.1:8080/v1/models"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    # Private internal network (no external egress)
    networks:
      - internal
    
    # Restart policy
    restart: unless-stopped
    
    # Logging configuration (bounded)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    
    # DNS configuration (no external resolution needed)
    dns:
      - 127.0.0.1
    dns_search: []
    
    # No privileged operations
    privileged: false
    
    # No Docker socket access
    # No /sys or /proc mounts beyond defaults

  proxy:
    image: nginx:1.27-alpine
    container_name: attackbox-proxy
    
    # Run as nginx user (UID 101 in nginx:alpine)
    user: "101:101"
    
    # Read-only root filesystem
    read_only: true
    
    # Drop all capabilities
    cap_drop:
      - ALL
    
    # Security hardening
    security_opt:
      - no-new-privileges:true
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
          pids: 50
        reservations:
          cpus: '0.25'
          memory: 64M
    
    # Writable paths for nginx
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m,mode=0770,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,nodev,size=4m,mode=0770,uid=101,gid=101
      - /var/log/nginx:rw,noexec,nosuid,nodev,size=16m,mode=0770,uid=101,gid=101
    
    # Configuration and TLS secrets
    volumes:
      - type: bind
        source: ./docker/nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
    
    secrets:
      - source: proxy_tls_cert
        target: /etc/nginx/ssl/server.crt
        mode: 0400
      - source: proxy_tls_key
        target: /etc/nginx/ssl/server.key
        mode: 0400
    
    # Publish on loopback only (default for local development)
    ports:
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8080:80"
    
    # Healthcheck
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    
    # Both internal and external networks
    networks:
      - internal
      - external
    
    # Restart policy
    restart: unless-stopped
    
    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    
    # Depends on bait
    depends_on:
      bait:
        condition: service_healthy
    
    # No privileged operations
    privileged: false

networks:
  # Internal network: bait <-> proxy only, no external egress
  internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  
  # External network: proxy internet access only
  external:
    driver: bridge

secrets:
  # Redaction secret for bait (32+ bytes)
  attackbox_secret:
    file: ./secrets/redaction.key
  
  # TLS certificate for proxy
  proxy_tls_cert:
    file: ./secrets/server.crt
  
  # TLS private key for proxy
  proxy_tls_key:
    file: ./secrets/server.key

# Default configuration notes:
# 1. No Watchtower or automatic image pulls
# 2. No unverified :latest tags (Dockerfile uses digests)
# 3. No forced net-raw capability
# 4. No Docker socket or management ports exposed
# 5. No metrics ports exposed (Prometheus/etc.)
# 6. Bait has no New Relic key (uses SPOOL_SOCKET)
# 7. Only intended /run/attackbox/spool.sock mount
# 8. Published ports default to loopback (127.0.0.1)
# 9. Runtime set to runsc (gVisor) but only runc available on host
