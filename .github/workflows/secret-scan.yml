name: secret-scan

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: credentials and private identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install pinned Gitleaks
        run: |
          GOBIN="$RUNNER_TEMP/gitleaks-bin" go install github.com/zricethezav/gitleaks/v8@v8.28.0
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Scan Git history
        run: gitleaks git --no-banner --redact=100 --config .gitleaks.toml --log-opts=HEAD .

      - name: repository rules
        run: bash scripts/scan-secrets.sh tree

      - name: local-only paths must not be tracked
        run: |
          bad=$(git ls-files | grep -E \
            '^(\.env$|\.env\.|\.vultr/|reports/|context-log.*\.md$|\.beads/|\.claude/|\.gnhf/|\.lavish/)|(^|/)__pycache__/|\.pyc$' \
            | grep -v -E '^secrets/(README\.md|\.gitignore)$' || true)
          if [ -n "$bad" ]; then
            echo "Local-only paths are tracked:"
            printf '  %s\n' "$bad"
            exit 1
          fi

      - name: private identifier blocklist
        env:
          BLOCKLIST: ${{ secrets.PRIVATE_IDENTIFIER_BLOCKLIST }}
        run: |
          if [ -z "${BLOCKLIST:-}" ]; then
            echo "PRIVATE_IDENTIFIER_BLOCKLIST is not set; skipping."
            exit 0
          fi
          mkdir -p secrets
          printf '%s\n' "$BLOCKLIST" > secrets/blocklist.txt
          bash scripts/scan-secrets.sh tree
