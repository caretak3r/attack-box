# Stage at /etc/attackbox/otel/bait-otel.conf. Activate only after new image verification.
[Unit]
After=attackbox-otel.service
Wants=attackbox-otel.service

[Service]
ExecStart=
ExecStart=/usr/bin/docker compose --env-file /etc/attackbox/monitoring.env -f /opt/attackbox/compose.yaml -f /opt/attackbox/compose.gvisor.yaml -f /opt/attackbox/compose.monitoring.yaml up -d --wait
ExecStop=
ExecStop=/usr/bin/docker compose --env-file /etc/attackbox/monitoring.env -f /opt/attackbox/compose.yaml -f /opt/attackbox/compose.gvisor.yaml -f /opt/attackbox/compose.monitoring.yaml down
