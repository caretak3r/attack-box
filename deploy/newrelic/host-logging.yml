# Host operational and audit logs. Raw attack evidence remains in the Go shipper.
# Never glob Docker/container logs or /var/lib/attackbox-shipper.
logs:
  - name: attackbox-host-audit
    file: /var/log/audit/audit.log
    attributes:
      service.name: attackbox-host
      collection_route: native-infrastructure
      logtype: linux_audit
  - name: attackbox-host-auth
    file: /var/log/auth.log
    attributes:
      service.name: attackbox-host
      collection_route: native-infrastructure
      logtype: linux_auth
  - name: attackbox-host-syslog
    file: /var/log/syslog
    attributes:
      service.name: attackbox-host
      collection_route: native-infrastructure
      logtype: syslog
  - name: attackbox-host-packages
    file: /var/log/dpkg.log
    attributes:
      service.name: attackbox-host
      collection_route: native-infrastructure
      logtype: dpkg
  - name: attackbox-host-cloud-init
    file: /var/log/cloud-init.log
    attributes:
      service.name: attackbox-host
      collection_route: native-infrastructure
      logtype: cloud_init
  - name: attackbox-host-alternatives
    file: /var/log/alternatives.log
    attributes:
      service.name: attackbox-host
      collection_route: native-infrastructure
      logtype: alternatives
