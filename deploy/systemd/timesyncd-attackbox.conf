# Host time sync for attack-box
# Drop-in for /etc/systemd/timesyncd.conf.d/
#
# The nftables output policy only allows NTP to the Cloudflare addresses in
# ntp_servers (deploy/nftables/attackbox.nft). time.cloudflare.com resolves to
# those addresses. The Ubuntu default pool would be dropped.

[Time]
NTP=time.cloudflare.com
FallbackNTP=
