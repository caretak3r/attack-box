# Host DNS for attack-box
# Drop-in for /etc/systemd/resolved.conf.d/
#
# The nftables output policy only allows DNS to these Cloudflare resolvers.
# Resolvers handed out by DHCP would be dropped, so pin the global servers and
# route every query to them (Domains=~.). Empty FallbackDNS stops resolved
# from trying the Ubuntu default fallback servers, which the firewall blocks.
# Keep this list in step with dns_servers_* in deploy/nftables/attackbox.nft.

[Resolve]
DNS=1.1.1.1 1.0.0.1 2606:4700:4700::1111 2606:4700:4700::1001
FallbackDNS=
Domains=~.
