# Bounded journald configuration for attack-box
# Drop-in for /etc/systemd/journald.conf.d/

[Journal]
# Bounded storage
SystemMaxUse=500M
SystemKeepFree=1G
SystemMaxFileSize=50M
SystemMaxFiles=10

# Bounded runtime journal
RuntimeMaxUse=100M
RuntimeKeepFree=100M
RuntimeMaxFileSize=10M
RuntimeMaxFiles=10

# Forward to syslog disabled (we use journal only)
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no

# Compression
Compress=yes

# Rate limiting (prevent log flooding)
RateLimitIntervalSec=30s
RateLimitBurst=10000
