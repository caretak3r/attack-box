receivers:
  otlp/public:
    protocols:
      grpc:
        transport: unix
        endpoint: /run/attackbox-public-otel/otlp.sock
        max_recv_msg_size_mib: 1
        max_concurrent_streams: 8

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 24
  filter/public:
    error_mode: propagate
    trace_conditions:
      - 'span.name != "public.request" and span.name != "public.health"'
      - 'Len(span.links) > 0'
      - 'spanevent.name == spanevent.name'
      - 'span.attributes["server.port"] == nil or not IsInt(span.attributes["server.port"])'
      - 'span.attributes["server.port"] != 443 or resource.attributes["service.name"] != "attackbox-public-443"'
      - 'span.attributes["client.address"] != nil and not IsString(span.attributes["client.address"])'
      - 'span.attributes["client.address"] != nil and IsString(span.attributes["client.address"]) and not IsMatch(span.attributes["client.address"], "^[0-9a-f:.]{2,39}$")'
      - 'span.name == "public.request" and span.attributes["attackbox.persona"] != "cloud-gateway"'
      - 'span.attributes["attackbox.persona"] != nil and span.attributes["attackbox.persona"] != "cloud-gateway"'
      - 'span.name == "public.request" and (span.attributes["http.request.method"] == nil or not IsString(span.attributes["http.request.method"]))'
      - 'span.attributes["http.request.method"] != nil and IsString(span.attributes["http.request.method"]) and not IsMatch(span.attributes["http.request.method"], "^(GET|HEAD|POST|PUT|DELETE|CONNECT|OPTIONS|TRACE|PATCH|_OTHER)$")'
      - 'span.name == "public.request" and (span.attributes["http.route"] == nil or not IsString(span.attributes["http.route"]))'
      - 'span.attributes["http.route"] != nil and IsString(span.attributes["http.route"]) and not IsMatch(span.attributes["http.route"], "^(/unmatched|/v1/models|/v1/chat/completions|/v1/completions|/openai/deployments/[{]deployment[}]/chat/completions)$")'
      - 'span.name == "public.request" and (span.attributes["http.response.status_code"] == nil or not IsInt(span.attributes["http.response.status_code"]))'
      - 'span.attributes["http.response.status_code"] != nil and IsInt(span.attributes["http.response.status_code"]) and (span.attributes["http.response.status_code"] < 100 or span.attributes["http.response.status_code"] > 599)'
      - 'span.attributes["attackbox.accepted_requests"] != nil and not IsInt(span.attributes["attackbox.accepted_requests"])'
      - 'span.attributes["attackbox.rate_limited_requests"] != nil and not IsInt(span.attributes["attackbox.rate_limited_requests"])'
      - 'span.attributes["attackbox.otel_dropped_spans_total"] != nil and not IsInt(span.attributes["attackbox.otel_dropped_spans_total"])'
      - 'span.attributes["attackbox.otel_export_failed_spans_total"] != nil and not IsInt(span.attributes["attackbox.otel_export_failed_spans_total"])'
  transform/public:
    error_mode: propagate
    trace_statements:
      - keep_keys(resource.attributes, ["service.name"])
      - set(resource.attributes["service.instance.id"], resource.attributes["service.name"])
      - set(resource.attributes["service.namespace"], "attackbox")
      - set(resource.attributes["host.id"], "${env:ATTACKBOX_HOST_ID}")
      - set(resource.attributes["host.name"], "${env:ATTACKBOX_HOST_NAME}")
      - set(resource.attributes["campaign.id"], "${env:ATTACKBOX_CAMPAIGN_ID}")
      - set(resource.attributes["service.version"], "${env:ATTACKBOX_PUBLIC_RELEASE_VERSION}")
      - set(resource.schema_url, "")
      - keep_keys(scope.attributes, [])
      - set(scope.name, "attackbox-public")
      - set(scope.version, "${env:ATTACKBOX_PUBLIC_RELEASE_VERSION}")
      - set(scope.schema_url, "")
      - keep_keys(span.attributes, ["server.port", "attackbox.persona", "http.route", "http.request.method", "http.response.status_code", "attackbox.accepted_requests", "attackbox.rate_limited_requests", "attackbox.otel_dropped_spans_total", "attackbox.otel_export_failed_spans_total"])
      - truncate_all(span.attributes, 128)
      - set(span.kind, SPAN_KIND_INTERNAL)
      - set(span.kind, SPAN_KIND_SERVER) where span.name == "public.request"
      - set(span.status.message, "")
      - set(span.trace_state, "")

exporters:
  otlp_http/newrelic:
    endpoint: https://otlp.nr-data.net:443
    headers:
      api-key: ${file:${env:CREDENTIALS_DIRECTORY}/newrelic_license_key}
    compression: gzip
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 2
      sizer: bytes
      queue_size: 16777216

extensions:
  health_check:
    endpoint: 127.0.0.1:13134

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: error
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8889
  pipelines:
    traces/public:
      receivers: [otlp/public]
      processors: [memory_limiter, filter/public, transform/public]
      exporters: [otlp_http/newrelic]
