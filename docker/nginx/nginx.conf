# Chainguard nginx runs as UID 65532 (nonroot)
worker_processes auto;
# Container journal captures TLS/parser failures as well as completed requests.
error_log /dev/stderr info;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main escape=json
        '{"component":"attackbox-proxy","edge_request_id":"$request_id",'
        '"bait_request_id":"$upstream_http_x_request_id","client_ip":"$remote_addr",'
        '"client_port":"$remote_port","timestamp":"$time_iso8601",'
        '"request":"$request","status":$status,"request_bytes":$request_length,'
        '"response_bytes":$bytes_sent,"request_seconds":$request_time,'
        '"upstream_status":"$upstream_status","tls_protocol":"$ssl_protocol",'
        '"tls_cipher":"$ssl_cipher","user_agent":"$http_user_agent",'
        '"claimed_forwarded_for":"$http_x_forwarded_for"}';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Temp paths on the writable tmpfs (rootfs is read-only)
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    # Support for long responses (SSE, NDJSON, streaming)
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
    
    # Request size limits (1MB body + headers)
    client_max_body_size 1m;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    upstream attackbox {
        server bait:8080;
        keepalive 32;
    }

    # HTTP server - redirect to HTTPS (unprivileged port 8080)
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    # HTTPS server (unprivileged port 8443)
    server {
        listen 8443 ssl http2;
        listen [::]:8443 ssl http2;
        server_name _;

        # TLS certificate paths (mount these as secrets)
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location / {
            proxy_pass http://attackbox;
            proxy_http_version 1.1;
            
            # Preserve client information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SSE/streaming support: no buffering, no compression. Accept is
            # forwarded untouched (the bait fingerprints client headers).
            proxy_buffering off;
            gzip off;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

        # Health endpoint (internal only, not proxied)
        location /nginx-health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
