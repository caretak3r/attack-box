# AttackBox Informational Alerts
# Lower-priority signals for activity monitoring

alerts:
  - name: "AttackBox - New Session Started"
    type: NRQL
    description: "New client session created (open live log view to observe)"
    enabled: true
    violation_time_limit_seconds: 600
    nrql:
      query: "FROM Metric SELECT sum(attackbox.sessions) WHERE metricName = 'attackbox.sessions'"
    signal:
      aggregation_window: 60
      evaluation_offset: 3
    terms:
      - priority: INFO
        threshold_duration: 60
        threshold_occurrences: AT_LEAST_ONCE
        operator: ABOVE
        threshold: 0

  - name: "AttackBox - Prompt Injection Detected"
    type: NRQL
    description: "Client attempting prompt extraction or instruction override"
    enabled: true
    violation_time_limit_seconds: 1800
    nrql:
      query: "FROM Metric SELECT sum(attackbox.probes) WHERE metricName = 'attackbox.probes' AND task IN ('prompt-extraction', 'instruction-override', 'indirect-injection')"
    signal:
      aggregation_window: 300
      evaluation_offset: 3
    terms:
      - priority: INFO
        threshold_duration: 300
        threshold_occurrences: AT_LEAST_ONCE
        operator: ABOVE
        threshold: 5

  - name: "AttackBox - Credential Access Attempts"
    type: NRQL
    description: "Client probing for credentials or sensitive data"
    enabled: true
    violation_time_limit_seconds: 1800
    nrql:
      query: "FROM Metric SELECT sum(attackbox.probes) WHERE metricName = 'attackbox.probes' AND task = 'credential-access'"
    signal:
      aggregation_window: 300
      evaluation_offset: 3
    terms:
      - priority: WARNING
        threshold_duration: 300
        threshold_occurrences: AT_LEAST_ONCE
        operator: ABOVE
        threshold: 10

  - name: "AttackBox - Shell Execution Attempts"
    type: NRQL
    description: "Client attempting command execution or file writes"
    enabled: true
    violation_time_limit_seconds: 1800
    nrql:
      query: "FROM Metric SELECT sum(attackbox.probes) WHERE metricName = 'attackbox.probes' AND task IN ('shell-execution', 'persistence')"
    signal:
      aggregation_window: 300
      evaluation_offset: 3
    terms:
      - priority: WARNING
        threshold_duration: 300
        threshold_occurrences: AT_LEAST_ONCE
        operator: ABOVE
        threshold: 5

  - name: "AttackBox - URL Exfiltration Attempts"
    type: NRQL
    description: "Client attempting to fetch URLs or exfiltrate data"
    enabled: true
    violation_time_limit_seconds: 1800
    nrql:
      query: "FROM Metric SELECT sum(attackbox.probes) WHERE metricName = 'attackbox.probes' AND task = 'url-exfiltration'"
    signal:
      aggregation_window: 300
      evaluation_offset: 3
    terms:
      - priority: INFO
        threshold_duration: 300
        threshold_occurrences: AT_LEAST_ONCE
        operator: ABOVE
        threshold: 3

  - name: "AttackBox - Request Rate Unusual"
    type: NRQL
    description: "Request rate significantly elevated (possible scanning or flooding)"
    enabled: true
    violation_time_limit_seconds: 1800
    nrql:
      query: "FROM Metric SELECT rate(sum(attackbox.requests), 1 minute) WHERE metricName = 'attackbox.requests'"
    signal:
      aggregation_window: 60
      evaluation_offset: 3
    terms:
      - priority: INFO
        threshold_duration: 300
        threshold_occurrences: AT_LEAST_ONCE
        operator: ABOVE
        threshold: 100

  - name: "AttackBox - Traffic Stopped"
    type: NRQL
    description: "No requests received for extended period (possible network issue or service down)"
    enabled: true
    violation_time_limit_seconds: 7200
    nrql:
      query: "FROM Metric SELECT sum(attackbox.requests) WHERE metricName = 'attackbox.requests'"
    signal:
      aggregation_window: 300
      evaluation_offset: 3
    terms:
      - priority: INFO
        threshold_duration: 1800
        threshold_occurrences: AT_LEAST_ONCE
        operator: EQUALS
        threshold: 0
    expiration:
      expiration_duration: 2400
      open_violation_on_expiration: false
      close_violations_on_expiration: true
