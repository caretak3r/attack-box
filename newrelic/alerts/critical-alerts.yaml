# AttackBox Critical Alerts
# Apply these to a dedicated alert policy with notification channels configured

alerts:
  - name: "AttackBox - Shipper Heartbeat Lost"
    type: NRQL
    description: "Host shipper has stopped reporting heartbeats (host down or egress blocked)"
    enabled: true
    violation_time_limit_seconds: 3600
    nrql:
      query: "FROM Log SELECT count(*) WHERE stream = 'heartbeat' AND source = 'shipper'"
    signal:
      aggregation_window: 60
      evaluation_offset: 3
    terms:
      - priority: CRITICAL
        threshold_duration: 120
        threshold_occurrences: AT_LEAST_ONCE
        operator: BELOW
        threshold: 1
    expiration:
      expiration_duration: 180
      open_violation_on_expiration: true
      close_violations_on_expiration: false

  - name: "AttackBox - Bait Connection Lost"
    type: NRQL
    description: "Bait process stopped sending records (container down, bait crashed)"
    enabled: true
    violation_time_limit_seconds: 3600
    nrql:
      query: "FROM Log SELECT latest(bait_connected) WHERE stream = 'heartbeat' AND source = 'shipper'"
    signal:
      aggregation_window: 60
      evaluation_offset: 3
    terms:
      - priority: CRITICAL
        threshold_duration: 120
        threshold_occurrences: AT_LEAST_ONCE
        operator: EQUALS
        threshold: 0

  - name: "AttackBox - Bait Record Age Excessive"
    type: NRQL
    description: "Bait connected but not sending records (hung process)"
    enabled: true
    violation_time_limit_seconds: 3600
    nrql:
      query: "FROM Log SELECT latest(last_bait_record_age_ms) WHERE stream = 'heartbeat' AND source = 'shipper' AND bait_connected = 1"
    signal:
      aggregation_window: 60
      evaluation_offset: 3
    terms:
      - priority: CRITICAL
        threshold_duration: 120
        threshold_occurrences: AT_LEAST_ONCE
        operator: ABOVE
        threshold: 90000

  - name: "AttackBox - Falco Critical Event"
    type: NRQL
    description: "Falco detected a critical host event (sandbox escape, privilege escalation)"
    enabled: true
    violation_time_limit_seconds: 600
    nrql:
      # Dedup by (record_id, body_sha256, chunk_index) to avoid replay/duplicate alerts
      query: "FROM Log SELECT uniqueCount(record_id) WHERE stream = 'runtime' AND action = 'falco' AND priority IN ('Critical', 'Emergency')"
    signal:
      aggregation_window: 60
      evaluation_offset: 3
    terms:
      - priority: CRITICAL
        threshold_duration: 60
        threshold_occurrences: AT_LEAST_ONCE
        operator: ABOVE
        threshold: 0

  - name: "AttackBox - Blocked Egress Spike"
    type: NRQL
    description: "High rate of blocked egress attempts (sandbox breakout attempts)"
    enabled: true
    violation_time_limit_seconds: 1800
    nrql:
      query: "FROM Log SELECT count(*) WHERE stream = 'egress' AND action = 'egress_blocked'"
    signal:
      aggregation_window: 60
      evaluation_offset: 3
    terms:
      - priority: WARNING
        threshold_duration: 300
        threshold_occurrences: AT_LEAST_ONCE
        operator: ABOVE
        threshold: 10
      - priority: CRITICAL
        threshold_duration: 180
        threshold_occurrences: AT_LEAST_ONCE
        operator: ABOVE
        threshold: 50

  - name: "AttackBox - Ingest Error Spike"
    type: NRQL
    description: "High rate of New Relic ingest errors (quota exhaustion, authentication failure)"
    enabled: true
    violation_time_limit_seconds: 1800
    nrql:
      query: "FROM Log SELECT count(*) WHERE stream = 'runtime' AND action = 'newrelic_error'"
    signal:
      aggregation_window: 60
      evaluation_offset: 3
    terms:
      - priority: WARNING
        threshold_duration: 300
        threshold_occurrences: AT_LEAST_ONCE
        operator: ABOVE
        threshold: 20
      - priority: CRITICAL
        threshold_duration: 180
        threshold_occurrences: AT_LEAST_ONCE
        operator: ABOVE
        threshold: 100

  - name: "AttackBox - NrIntegrationError Events"
    type: NRQL
    description: "New Relic platform integration errors detected"
    enabled: true
    violation_time_limit_seconds: 1800
    nrql:
      query: "FROM NrIntegrationError SELECT count(*)"
    signal:
      aggregation_window: 60
      evaluation_offset: 3
    terms:
      - priority: WARNING
        threshold_duration: 300
        threshold_occurrences: AT_LEAST_ONCE
        operator: ABOVE
        threshold: 10

  - name: "AttackBox - Queue Backlog Critical"
    type: NRQL
    description: "Shipper queue backlog approaching capacity (ingest degraded)"
    enabled: true
    violation_time_limit_seconds: 1800
    nrql:
      query: "FROM Log SELECT latest(queue_backlog_bytes) WHERE stream = 'heartbeat' AND source = 'shipper'"
    signal:
      aggregation_window: 60
      evaluation_offset: 3
    terms:
      - priority: WARNING
        threshold_duration: 300
        threshold_occurrences: AT_LEAST_ONCE
        operator: ABOVE
        threshold: 134217728  # 128 MB
      - priority: CRITICAL
        threshold_duration: 300
        threshold_occurrences: AT_LEAST_ONCE
        operator: ABOVE
        threshold: 234881024  # 224 MB (87.5% of 256 MB)

  - name: "AttackBox - Canary Token Reused"
    type: NRQL
    description: "Client returned a session-unique canary credential (credential leakage behavior)"
    enabled: true
    violation_time_limit_seconds: 3600
    nrql:
      # Dedup canary events by chunk identity
      query: "FROM Log SELECT uniqueCount(record_id) WHERE stream = 'probe' AND action = 'canary-reuse'"
    signal:
      aggregation_window: 60
      evaluation_offset: 3
    terms:
      - priority: WARNING
        threshold_duration: 60
        threshold_occurrences: AT_LEAST_ONCE
        operator: ABOVE
        threshold: 0
